<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <defs>
    <!-- Grid pattern for subtle urban sub-blocks -->
    <pattern id="urban-subgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" x="2" y="2" rx="2" fill="#063b5c" fill-opacity="0.012" stroke="#063b5c" stroke-width="0.5" stroke-opacity="0.035" />
      <circle cx="20" cy="20" r="1" fill="#0082c0" fill-opacity="0.05" />
    </pattern>

    <!-- Dense commercial block pattern -->
    <pattern id="commercial-lots" width="80" height="60" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="74" height="25" rx="2" fill="#063b5c" fill-opacity="0.018" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
      <rect x="3" y="32" width="35" height="25" rx="2" fill="#063b5c" fill-opacity="0.014" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
      <rect x="42" y="32" width="35" height="25" rx="2" fill="#063b5c" fill-opacity="0.014" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    </pattern>

    <!-- Linear gradients for roads and avenues -->
    <linearGradient id="road-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#063b5c" stop-opacity="0.02" />
      <stop offset="30%" stop-color="#063b5c" stop-opacity="0.07" />
      <stop offset="70%" stop-color="#063b5c" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#063b5c" stop-opacity="0.02" />
    </linearGradient>

    <!-- Soft radial mask for Ali Plaza locator beacon -->
    <radialGradient id="beacon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0082c0" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#0082c0" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0082c0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- CARTOGRAPHIC BASE LAYER: LAT/LONG COORDINATE GRID -->
  <g id="coord-grid" stroke="#063b5c" stroke-opacity="0.03" stroke-width="0.75" stroke-dasharray="3,6">
    <line x1="160" y1="0" x2="160" y2="1000" />
    <line x1="380" y1="0" x2="380" y2="1000" />
    <line x1="600" y1="0" x2="600" y2="1000" />
    <line x1="820" y1="0" x2="820" y2="1000" />
    <line x1="1040" y1="0" x2="1040" y2="1000" />
    <line x1="1260" y1="0" x2="1260" y2="1000" />
    <line x1="1480" y1="0" x2="1480" y2="1000" />

    <line x1="0" y1="120" x2="1600" y2="120" />
    <line x1="0" y1="280" x2="1600" y2="280" />
    <line x1="0" y1="460" x2="1600" y2="460" />
    <line x1="0" y1="640" x2="1600" y2="640" />
    <line x1="0" y1="820" x2="1600" y2="820" />
  </g>

  <!-- COORDINATE INTERSECTION CROSSHAIRS -->
  <g id="crosshairs" stroke="#063b5c" stroke-opacity="0.08" stroke-width="1">
    <path d="M154,120 h12 M160,114 v12" />
    <path d="M374,120 h12 M380,114 v12" />
    <path d="M594,120 h12 M600,114 v12" />
    <path d="M814,120 h12 M820,114 v12" />
    <path d="M1034,120 h12 M1040,114 v12" />
    <path d="M1254,120 h12 M1260,114 v12" />
    <path d="M1474,120 h12 M1480,114 v12" />

    <path d="M154,280 h12 M160,274 v12" />
    <path d="M374,280 h12 M380,274 v12" />
    <path d="M594,280 h12 M600,274 v12" />
    <path d="M814,280 h12 M820,274 v12" />
    <path d="M1034,280 h12 M1040,274 v12" />
    <path d="M1254,280 h12 M1260,274 v12" />
    <path d="M1474,280 h12 M1480,274 v12" />

    <path d="M154,460 h12 M160,454 v12" />
    <path d="M374,460 h12 M380,454 v12" />
    <path d="M594,460 h12 M600,454 v12" />
    <path d="M814,460 h12 M820,454 v12" />
    <path d="M1034,460 h12 M1040,454 v12" />
    <path d="M1254,460 h12 M1260,454 v12" />
    <path d="M1474,460 h12 M1480,454 v12" />

    <path d="M154,640 h12 M160,634 v12" />
    <path d="M374,640 h12 M380,634 v12" />
    <path d="M594,640 h12 M600,634 v12" />
    <path d="M814,640 h12 M820,634 v12" />
    <path d="M1034,640 h12 M1040,634 v12" />
    <path d="M1254,640 h12 M1260,634 v12" />
    <path d="M1474,640 h12 M1480,634 v12" />

    <path d="M154,820 h12 M160,814 v12" />
    <path d="M374,820 h12 M380,814 v12" />
    <path d="M594,820 h12 M600,814 v12" />
    <path d="M814,820 h12 M820,814 v12" />
    <path d="M1034,820 h12 M1040,814 v12" />
    <path d="M1254,820 h12 M1260,814 v12" />
    <path d="M1474,820 h12 M1480,814 v12" />
  </g>

  <!-- TOPOGRAPHIC CONTOUR LINES (Margalla Foothills North Gradient) -->
  <g id="topography" stroke="#0082c0" stroke-opacity="0.035" stroke-width="0.9" fill="none">
    <path d="M0,45 C280,30 520,70 850,40 C1140,15 1380,55 1600,35" />
    <path d="M0,85 C240,65 540,110 880,75 C1190,45 1420,90 1600,70" />
    <path d="M0,135 C290,115 570,150 920,120 C1220,90 1440,130 1600,115" stroke-dasharray="4,4" />
    <path d="M0,185 C310,165 600,200 950,170 C1250,140 1460,175 1600,160" />
  </g>

  <!-- URBAN SECTOR BLOCKS (Islamabad Grid Zones) -->
  <g id="sector-blocks">
    <!-- North Commercial & Institutional Blocks (F-5 / Diplomatic Enclave proximity) -->
    <rect x="80" y="190" width="260" height="150" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="370" y="190" width="200" height="150" rx="3" fill="url(#commercial-lots)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="600" y="190" width="260" height="150" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="890" y="190" width="280" height="150" rx="3" fill="url(#commercial-lots)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="1200" y="190" width="320" height="150" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />

    <!-- Blue Area Central Commercial Strip Blocks -->
    <rect x="120" y="380" width="220" height="85" rx="3" fill="url(#commercial-lots)" stroke="#063b5c" stroke-width="0.9" stroke-opacity="0.05" />
    <rect x="370" y="380" width="200" height="85" rx="3" fill="url(#commercial-lots)" stroke="#063b5c" stroke-width="0.9" stroke-opacity="0.05" />
    
    <!-- Ali Plaza Vicinity Commercial Block -->
    <rect x="600" y="380" width="260" height="85" rx="3" fill="#0082c0" fill-opacity="0.015" stroke="#0082c0" stroke-width="1.2" stroke-opacity="0.08" />
    
    <rect x="890" y="380" width="280" height="85" rx="3" fill="url(#commercial-lots)" stroke="#063b5c" stroke-width="0.9" stroke-opacity="0.05" />
    <rect x="1200" y="380" width="320" height="85" rx="3" fill="url(#commercial-lots)" stroke="#063b5c" stroke-width="0.9" stroke-opacity="0.05" />

    <!-- South Residential & Office Sectors (G-5 Zone) -->
    <rect x="80" y="520" width="260" height="180" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="370" y="520" width="200" height="180" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="600" y="520" width="260" height="180" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="890" y="520" width="280" height="180" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />
    <rect x="1200" y="520" width="320" height="180" rx="3" fill="url(#urban-subgrid)" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.04" />

    <!-- Further South Park & Institutional Enclave -->
    <rect x="140" y="740" width="380" height="160" rx="4" fill="#063b5c" fill-opacity="0.012" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.035" />
    <rect x="560" y="740" width="440" height="160" rx="4" fill="#063b5c" fill-opacity="0.012" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.035" />
    <rect x="1040" y="740" width="440" height="160" rx="4" fill="#063b5c" fill-opacity="0.012" stroke="#063b5c" stroke-width="0.8" stroke-opacity="0.035" />
  </g>

  <!-- URBAN ROAD NETWORK (AVENUES & ARTERIAL BOULEVARDS) -->
  <g id="road-network">
    <!-- JINNAH AVENUE (Primary Central Commercial Spine) -->
    <!-- North Service Road -->
    <line x1="0" y1="365" x2="1600" y2="365" stroke="url(#road-fade)" stroke-width="1.2" />
    
    <!-- Main Jinnah Avenue Boulevard (Dual Carriageway with median) -->
    <line x1="0" y1="480" x2="1600" y2="480" stroke="#063b5c" stroke-opacity="0.06" stroke-width="12" />
    <line x1="0" y1="480" x2="1600" y2="480" stroke="#ffffff" stroke-width="1.8" />
    <line x1="0" y1="474" x2="1600" y2="474" stroke="#0082c0" stroke-opacity="0.06" stroke-width="0.8" stroke-dasharray="6,4" />
    <line x1="0" y1="486" x2="1600" y2="486" stroke="#0082c0" stroke-opacity="0.06" stroke-width="0.8" stroke-dasharray="6,4" />

    <!-- South Service Road -->
    <line x1="0" y1="505" x2="1600" y2="505" stroke="url(#road-fade)" stroke-width="1.2" />

    <!-- FAZAL-E-HAQ ROAD (Inner Blue Area Parallel Corridor) -->
    <line x1="0" y1="355" x2="1600" y2="355" stroke="#063b5c" stroke-opacity="0.04" stroke-width="2.5" />

    <!-- CROSS-SECTOR CONNECTING AVENUES (7th Ave, Faisal Ave, Constitution Ave corridors) -->
    <!-- Avenue 1 (West) -->
    <line x1="355" y1="0" x2="355" y2="1000" stroke="#063b5c" stroke-opacity="0.05" stroke-width="8" />
    <line x1="355" y1="0" x2="355" y2="1000" stroke="#ffffff" stroke-width="1.5" />

    <!-- Avenue 2 (Central - F-5 / Ali Plaza link) -->
    <line x1="585" y1="0" x2="585" y2="1000" stroke="#063b5c" stroke-opacity="0.05" stroke-width="6" />

    <!-- Avenue 3 (East Central - Constitution Ave corridor) -->
    <line x1="875" y1="0" x2="875" y2="1000" stroke="#063b5c" stroke-opacity="0.06" stroke-width="10" />
    <line x1="875" y1="0" x2="875" y2="1000" stroke="#ffffff" stroke-width="1.5" />

    <!-- Avenue 4 (East Enclave) -->
    <line x1="1185" y1="0" x2="1185" y2="1000" stroke="#063b5c" stroke-opacity="0.05" stroke-width="7" />

    <!-- Secondary sector service lanes -->
    <line x1="0" y1="720" x2="1600" y2="720" stroke="#063b5c" stroke-opacity="0.035" stroke-width="2" />
    <line x1="0" y1="920" x2="1600" y2="920" stroke="#063b5c" stroke-opacity="0.035" stroke-width="2" />

    <!-- Diagonal Arterial Highway Connector -->
    <path d="M0,900 Q400,850 875,720 T1600,600" fill="none" stroke="#0082c0" stroke-opacity="0.04" stroke-width="3" stroke-dasharray="8,5" />
  </g>

  <!-- ICONIC ISLAMABAD ROUNDABOUTS / TRAFFIC CHOWKS -->
  <g id="roundabouts">
    <!-- Chowk 1 (Jinnah Ave x West Ave) -->
    <circle cx="355" cy="480" r="28" fill="#ffffff" stroke="#063b5c" stroke-opacity="0.07" stroke-width="4" />
    <circle cx="355" cy="480" r="14" fill="#063b5c" fill-opacity="0.02" stroke="#0082c0" stroke-opacity="0.05" stroke-width="1" />

    <!-- Chowk 2 (Jinnah Ave x East Central / Constitution) -->
    <circle cx="875" cy="480" r="32" fill="#ffffff" stroke="#063b5c" stroke-opacity="0.08" stroke-width="4" />
    <circle cx="875" cy="480" r="16" fill="#063b5c" fill-opacity="0.025" stroke="#0082c0" stroke-opacity="0.06" stroke-width="1" />
  </g>

  <!-- ALI PLAZA FOCAL LOCATOR BEACON (Coordinates: 33.7272° N, 73.0877° E) -->
  <g id="ali-plaza-target">
    <!-- Radial pulse glow background -->
    <circle cx="730" cy="422" r="140" fill="url(#beacon-glow)" />

    <!-- Target rings -->
    <circle cx="730" cy="422" r="100" fill="none" stroke="#0082c0" stroke-opacity="0.04" stroke-width="0.8" stroke-dasharray="3,3" />
    <circle cx="730" cy="422" r="65" fill="none" stroke="#0082c0" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="5,3" />
    <circle cx="730" cy="422" r="38" fill="none" stroke="#063b5c" stroke-opacity="0.08" stroke-width="1.2" />
    <circle cx="730" cy="422" r="18" fill="#0082c0" fill-opacity="0.04" stroke="#0082c0" stroke-opacity="0.15" stroke-width="1.5" />
    
    <!-- Ali Plaza Pin Center -->
    <circle cx="730" cy="422" r="4.5" fill="#063b5c" fill-opacity="0.25" />
    <circle cx="730" cy="422" r="1.5" fill="#ffffff" />

    <!-- Location callout lines -->
    <path d="M730,404 v-18 h45" fill="none" stroke="#0082c0" stroke-opacity="0.18" stroke-width="1" />
    <circle cx="775" cy="386" r="2" fill="#0082c0" fill-opacity="0.25" />
    <text x="782" y="390" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#063b5c" fill-opacity="0.32">ALI PLAZA • RENOV8</text>
  </g>

  <!-- MINIMALIST CARTOGRAPHIC ANNOTATIONS & LABELS -->
  <g id="map-labels" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="600" text-anchor="start">
    <!-- Avenue Names -->
    <text x="960" y="474" font-size="8.5" letter-spacing="3" fill="#063b5c" fill-opacity="0.18">JINNAH AVENUE / BLUE AREA</text>
    <text x="960" y="350" font-size="7.5" letter-spacing="2" fill="#063b5c" fill-opacity="0.12">FAZAL-E-HAQ RD</text>
    <text x="365" y="80" font-size="8" letter-spacing="2.5" fill="#063b5c" fill-opacity="0.14" transform="rotate(90 365,80)">ATATURK AVE</text>
    <text x="885" y="80" font-size="8" letter-spacing="2.5" fill="#063b5c" fill-opacity="0.14" transform="rotate(90 885,80)">CONSTITUTION AVE</text>

    <!-- Sector Labels -->
    <text x="200" y="270" font-size="12" font-weight="700" letter-spacing="4" fill="#063b5c" fill-opacity="0.08">SECTOR F-6</text>
    <text x="680" y="270" font-size="12" font-weight="700" letter-spacing="4" fill="#0082c0" fill-opacity="0.12">SECTOR F-5</text>
    <text x="1320" y="270" font-size="12" font-weight="700" letter-spacing="4" fill="#063b5c" fill-opacity="0.08">DIPLOMATIC ENCLAVE</text>

    <text x="200" y="620" font-size="12" font-weight="700" letter-spacing="4" fill="#063b5c" fill-opacity="0.08">SECTOR G-6</text>
    <text x="680" y="620" font-size="12" font-weight="700" letter-spacing="4" fill="#063b5c" fill-opacity="0.08">SECTOR G-5</text>

    <!-- Geographic & Elevation Stamp -->
    <text x="1360" y="930" font-size="8" letter-spacing="1.5" fill="#063b5c" fill-opacity="0.15">33°43'38"N  73°05'16"E</text>
    <text x="1360" y="946" font-size="7.5" letter-spacing="1.5" fill="#063b5c" fill-opacity="0.12">ISLAMABAD • ELEV 540M</text>
    <text x="1360" y="962" font-size="7.5" letter-spacing="1.5" fill="#0082c0" fill-opacity="0.18">GRID PK-ISB-05</text>
  </g>

  <!-- ARCHITECTURAL COMPASS / NORTH ARROW (Top Right) -->
  <g id="compass" transform="translate(1500, 100)" stroke="#063b5c" stroke-opacity="0.08" stroke-width="1">
    <circle cx="0" cy="0" r="28" fill="none" />
    <circle cx="0" cy="0" r="22" fill="none" stroke-dasharray="2,3" stroke-opacity="0.06" />
    <!-- North Arrow -->
    <polygon points="0,-18 4,0 0,-4 -4,0" fill="#063b5c" fill-opacity="0.16" stroke="none" />
    <polygon points="0,18 4,0 0,4 -4,0" fill="#063b5c" fill-opacity="0.05" stroke="none" />
    <text x="-3.5" y="-24" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="700" fill="#063b5c" fill-opacity="0.22" stroke="none">N</text>
  </g>
</svg>
